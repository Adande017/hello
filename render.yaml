services:
  - type: web
    name: payment-api-demo
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/payment_demo.db
    disk:
      name: payment-db-data
      mountPath: /var/data
      sizeGB: 1
